# tabs and spaces thingy
# 4 spaces indent
indent_style = "Block"
hard_tabs = false
tab_spaces = 4

# line widths
# use 100 if you can
width = 100
max_width = 120

# ✨ haha look im an LLM now i gotta be sassy lol
reorder_imports = false
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# other shit
format_code_in_doc_comments = true
# why do people like multi line wheres? i understand it if its large tho
where_single_line = true
format_strings = true
normalize_comments = true

# legacy code...
use_try_shorthand = true
